name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install pinned WASI SDK
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/wasi-sdk.tar.gz"
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
      - name: Build WebAssembly cores
        run: npm run build:wasm
        env:
          WASI_SDK: ${{ runner.temp }}/wasi-sdk-25.0-x86_64-linux
      - run: npm test
      - run: npm run build
